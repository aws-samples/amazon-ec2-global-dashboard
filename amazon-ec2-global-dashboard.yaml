AWSTemplateFormatVersion: 2010-09-09
Description: >-
  Amazon EC2 Global Dashboard. Monitor how many EC2 instances are running across
  all enabled regions with a CloudWatch dashboard that is rebuilt automatically.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Monitoring scope
        Parameters:
          - MonitorMode
          - TagKey
          - TagValue
    ParameterLabels:
      MonitorMode:
        default: Which instances to count
      TagKey:
        default: Tag key (tag mode only)
      TagValue:
        default: Tag value (tag mode only)

Parameters:
  MonitorMode:
    Type: String
    Default: all
    AllowedValues:
      - all
      - tag
    Description: "'all' counts every running EC2 instance. 'tag' counts only running instances matching TagKey and TagValue."
  TagKey:
    Type: String
    Default: amazon-ec2-global-dashboard
    MinLength: 1
    Description: Tag key to filter on when MonitorMode is 'tag'. Enter the plain key, without a 'tag:' prefix.
  TagValue:
    Type: String
    Default: enabled
    MinLength: 1
    Description: Tag value to filter on when MonitorMode is 'tag'.

Resources:
  FunctionLogGroup:
    Type: 'AWS::Logs::LogGroup'
    Properties:
      LogGroupName: /aws/lambda/amazon-ec2-global-dashboard
      RetentionInDays: 30

  LambdaExecutionRole:
    Type: 'AWS::IAM::Role'
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: 'sts:AssumeRole'
      Path: /
      Policies:
        - PolicyName: amazon-ec2-global-dashboard
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Sid: DescribeEC2
                Effect: Allow
                Action:
                  - 'ec2:DescribeRegions'
                  - 'ec2:DescribeInstances'
                Resource: '*'
              - Sid: PutMetrics
                Effect: Allow
                Action: 'cloudwatch:PutMetricData'
                Resource: '*'
                Condition:
                  StringEquals:
                    'cloudwatch:namespace': Running-instances
              - Sid: ManageDashboard
                Effect: Allow
                Action:
                  - 'cloudwatch:PutDashboard'
                  - 'cloudwatch:DeleteDashboards'
                Resource: !Sub 'arn:${AWS::Partition}:cloudwatch::${AWS::AccountId}:dashboard/Amazon_EC2_Global_Dashboard'
              - Sid: WriteLogs
                Effect: Allow
                Action:
                  - 'logs:CreateLogStream'
                  - 'logs:PutLogEvents'
                Resource: !GetAtt FunctionLogGroup.Arn

  AmazonEC2GlobalDashboardFunction:
    Type: 'AWS::Lambda::Function'
    DependsOn: FunctionLogGroup
    Properties:
      FunctionName: amazon-ec2-global-dashboard
      Description: Counts running EC2 instances in every enabled region, publishes the counts to CloudWatch and rebuilds the dashboard.
      Runtime: python3.13
      Handler: index.lambda_handler
      Timeout: 120
      MemorySize: 256
      Role: !GetAtt LambdaExecutionRole.Arn
      Environment:
        Variables:
          MONITOR_MODE: !Ref MonitorMode
          TAG_KEY: !Ref TagKey
          TAG_VALUE: !Ref TagValue
          DASHBOARD_NAME: Amazon_EC2_Global_Dashboard
      Code:
        ZipFile: |
          import json
          import logging
          import math
          import os
          from concurrent.futures import ThreadPoolExecutor

          import boto3
          import cfnresponse
          from botocore.config import Config

          logger = logging.getLogger()
          logger.setLevel(logging.INFO)

          MONITOR_MODE = os.environ['MONITOR_MODE']
          TAG_KEY = os.environ['TAG_KEY']
          TAG_VALUE = os.environ['TAG_VALUE']
          DASHBOARD_NAME = os.environ['DASHBOARD_NAME']
          HOME_REGION = os.environ['AWS_REGION']

          NAMESPACE = 'Running-instances'
          METRIC_NAME = 'running-state'
          PERIOD_SECONDS = 900

          BOTO_CONFIG = Config(retries={'max_attempts': 5, 'mode': 'standard'})
          cloudwatch = boto3.client('cloudwatch', config=BOTO_CONFIG)
          ec2 = boto3.client('ec2', config=BOTO_CONFIG)

          # Display names are cosmetic. Regions not listed here are shown by code.
          REGION_NAMES = {
              'us-east-1': 'US East (N. Virginia)',
              'us-east-2': 'US East (Ohio)',
              'us-west-1': 'US West (N. California)',
              'us-west-2': 'US West (Oregon)',
              'af-south-1': 'Africa (Cape Town)',
              'ap-east-1': 'Asia Pacific (Hong Kong)',
              'ap-south-1': 'Asia Pacific (Mumbai)',
              'ap-south-2': 'Asia Pacific (Hyderabad)',
              'ap-southeast-1': 'Asia Pacific (Singapore)',
              'ap-southeast-2': 'Asia Pacific (Sydney)',
              'ap-southeast-3': 'Asia Pacific (Jakarta)',
              'ap-southeast-4': 'Asia Pacific (Melbourne)',
              'ap-southeast-5': 'Asia Pacific (Malaysia)',
              'ap-southeast-7': 'Asia Pacific (Thailand)',
              'ap-northeast-1': 'Asia Pacific (Tokyo)',
              'ap-northeast-2': 'Asia Pacific (Seoul)',
              'ap-northeast-3': 'Asia Pacific (Osaka)',
              'ca-central-1': 'Canada (Central)',
              'ca-west-1': 'Canada West (Calgary)',
              'eu-central-1': 'Europe (Frankfurt)',
              'eu-central-2': 'Europe (Zurich)',
              'eu-west-1': 'Europe (Ireland)',
              'eu-west-2': 'Europe (London)',
              'eu-west-3': 'Europe (Paris)',
              'eu-north-1': 'Europe (Stockholm)',
              'eu-south-1': 'Europe (Milan)',
              'eu-south-2': 'Europe (Spain)',
              'il-central-1': 'Israel (Tel Aviv)',
              'me-south-1': 'Middle East (Bahrain)',
              'me-central-1': 'Middle East (UAE)',
              'mx-central-1': 'Mexico (Central)',
              'sa-east-1': 'South America (Sao Paulo)',
          }


          def count_running(region):
              """Return (region, running instance count), or (region, None) on failure."""
              filters = [{'Name': 'instance-state-name', 'Values': ['running']}]
              if MONITOR_MODE == 'tag':
                  filters.append({'Name': 'tag:' + TAG_KEY, 'Values': [TAG_VALUE]})
              try:
                  client = boto3.client('ec2', region_name=region, config=BOTO_CONFIG)
                  count = 0
                  for page in client.get_paginator('describe_instances').paginate(Filters=filters):
                      count += sum(len(r['Instances']) for r in page['Reservations'])
                  return region, count
              except Exception:
                  logger.exception('Could not count instances in %s', region)
                  return region, None


          def build_dashboard(regions):
              metrics = [[NAMESPACE, METRIC_NAME, 'region', r] for r in regions]
              height = max(6, math.ceil(len(regions) * 0.75))
              rows = ['# Region mapping', 'Code|Name', '----|----']
              for r in regions:
                  url = ('https://%s.console.aws.amazon.com/ec2/home?region=%s'
                         '#Instances:instanceState=running;sort=instanceId' % (r, r))
                  rows.append('[%s](%s)|%s' % (r, url, REGION_NAMES.get(r, r)))
              return json.dumps({'widgets': [
                  {'type': 'metric', 'x': 0, 'y': 0, 'width': 12, 'height': height,
                   'properties': {'metrics': metrics, 'region': HOME_REGION, 'view': 'singleValue',
                                  'sparkline': True, 'period': PERIOD_SECONDS, 'stat': 'Maximum',
                                  'title': 'Running Instances'}},
                  {'type': 'text', 'x': 12, 'y': 0, 'width': 6, 'height': height,
                   'properties': {'markdown': '\n'.join(rows) + '\n'}},
                  {'type': 'metric', 'x': 0, 'y': height, 'width': 18, 'height': 8,
                   'properties': {'metrics': metrics, 'region': HOME_REGION, 'view': 'timeSeries',
                                  'stacked': False, 'period': PERIOD_SECONDS, 'stat': 'Maximum',
                                  'title': 'Running Instances (history)'}},
              ]})


          def sync():
              regions = sorted(r['RegionName'] for r in ec2.describe_regions()['Regions'])
              with ThreadPoolExecutor(max_workers=10) as pool:
                  results = list(pool.map(count_running, regions))

              data = [{'MetricName': METRIC_NAME,
                       'Dimensions': [{'Name': 'region', 'Value': region}],
                       'Unit': 'Count', 'Value': count}
                      for region, count in results if count is not None]
              for i in range(0, len(data), 150):
                  cloudwatch.put_metric_data(Namespace=NAMESPACE, MetricData=data[i:i + 150])

              cloudwatch.put_dashboard(DashboardName=DASHBOARD_NAME, DashboardBody=build_dashboard(regions))

              failed = [region for region, count in results if count is None]
              if failed:
                  raise RuntimeError('Failed to count instances in: ' + ', '.join(failed))


          def handle_custom_resource(event, context):
              status = cfnresponse.SUCCESS
              reason = None
              try:
                  if event['RequestType'] == 'Delete':
                      cloudwatch.delete_dashboards(DashboardNames=[DASHBOARD_NAME])
                  else:
                      sync()
              except Exception as e:
                  # Never fail the stack over this; the schedule retries every 15 minutes.
                  logger.exception('Custom resource %s failed', event['RequestType'])
                  reason = str(e)
              cfnresponse.send(event, context, status, {}, DASHBOARD_NAME, reason=reason)


          def lambda_handler(event, context):
              if 'RequestType' in event:
                  return handle_custom_resource(event, context)
              sync()

  ScheduledRule:
    Type: 'AWS::Events::Rule'
    Properties:
      Description: Amazon EC2 Global Dashboard schedule.
      ScheduleExpression: rate(15 minutes)
      State: ENABLED
      Targets:
        - Arn: !GetAtt AmazonEC2GlobalDashboardFunction.Arn
          Id: AmazonEC2GlobalDashboardFunction

  PermissionForEventsToInvokeLambda:
    Type: 'AWS::Lambda::Permission'
    Properties:
      FunctionName: !Ref AmazonEC2GlobalDashboardFunction
      Action: 'lambda:InvokeFunction'
      Principal: events.amazonaws.com
      SourceArn: !GetAtt ScheduledRule.Arn

  # Builds the dashboard immediately on create/update and removes it on delete.
  DashboardSync:
    Type: 'Custom::DashboardSync'
    DependsOn:
      - FunctionLogGroup
      - LambdaExecutionRole
    Properties:
      ServiceToken: !GetAtt AmazonEC2GlobalDashboardFunction.Arn
      MonitorMode: !Ref MonitorMode
      TagKey: !Ref TagKey
      TagValue: !Ref TagValue

Outputs:
  Region:
    Description: Region the stack was launched in.
    Value: !Ref 'AWS::Region'
  MonitorMode:
    Description: "'all' = every running instance. 'tag' = only instances matching the tag."
    Value: !Ref MonitorMode
  DashboardUrl:
    Description: CloudWatch dashboard.
    Value: !Sub 'https://${AWS::Region}.console.${AWS::Partition}.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards:name=Amazon_EC2_Global_Dashboard'
